  <!-- cielo -->
  <rect width="1024" height="1024" fill="url(#cielo)"/>

  <!-- estrellas -->
  <g fill="#D6E9FF">
    <circle cx="92" cy="120" r="2.4" opacity="0.75"/>
    <circle cx="176" cy="64" r="1.6" opacity="0.5"/>
    <circle cx="268" cy="150" r="2" opacity="0.6"/>
    <circle cx="330" cy="72" r="1.4" opacity="0.42"/>
    <circle cx="420" cy="126" r="1.8" opacity="0.55"/>
    <circle cx="512" cy="58" r="1.5" opacity="0.45"/>
    <circle cx="640" cy="112" r="2.1" opacity="0.6"/>
    <circle cx="712" cy="52" r="1.5" opacity="0.4"/>
    <circle cx="936" cy="96" r="2.2" opacity="0.6"/>
    <circle cx="980" cy="196" r="1.5" opacity="0.42"/>
    <circle cx="60" cy="268" r="1.6" opacity="0.45"/>
    <circle cx="150" cy="350" r="2" opacity="0.5"/>
    <circle cx="864" cy="420" r="1.6" opacity="0.4"/>
    <circle cx="962" cy="330" r="1.9" opacity="0.5"/>
  </g>

  <!-- luna -->
  <circle cx="806" cy="306" r="196" fill="url(#lunaGlow)"/>
  <circle cx="806" cy="306" r="74" fill="#EAF5DA"/>
  <circle cx="780" cy="286" r="14" fill="#D3E4BE" opacity="0.75"/>
  <circle cx="822" cy="326" r="10" fill="#D3E4BE" opacity="0.65"/>
  <circle cx="816" cy="282" r="7" fill="#D3E4BE" opacity="0.55"/>

