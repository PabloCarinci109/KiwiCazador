    <ellipse cx="492" cy="742" rx="118" ry="92" fill="url(#panza)" opacity="0.55"/>
    <!-- cabeza -->
    <circle cx="560" cy="534" r="96" fill="url(#cuerpo)"/>
    <path d="M 566 442 A 96 96 0 0 1 648 512" stroke="#C79B60" stroke-width="7" fill="none"
          opacity="0.5" stroke-linecap="round"/>
    <!-- pico -->
    <path d="M 626 516 Q 728 542 806 598 Q 720 596 620 570 Z" fill="url(#pico)"/>
    <path d="M 626 556 Q 714 576 790 596 Q 710 592 622 572 Z" fill="#8E6F45" opacity="0.55"/>
    <!-- ojo -->
    <circle cx="592" cy="500" r="15" fill="#120E0A"/>
    <circle cx="597" cy="495" r="5" fill="#FFFFFF" opacity="0.85"/>
    <!-- plumas -->
    <g stroke="#42280F" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round">
      <path d="M 392 640 Q 430 626 466 630"/>
      <path d="M 380 686 Q 418 672 456 676"/>
      <path d="M 386 732 Q 424 718 462 722"/>
    </g>
    <!-- gorra de cazador -->
    <g transform="rotate(-7 560 436)">
      <path d="M 486 452 Q 500 396 566 392 Q 632 396 640 452 Z" fill="#55663A"/>
      <ellipse cx="562" cy="456" rx="102" ry="22" fill="#46552F"/>
      <rect x="494" y="428" width="122" height="14" rx="7" fill="#2C351E"/>
      <path d="M 520 402 Q 560 390 606 404" stroke="#6C7E4C" stroke-width="6" fill="none" opacity="0.6"/>
    </g>
  </g>

  <!-- título -->
  <g font-family="Fira Sans Compressed Heavy" font-weight="900">
    <text x="512" y="150" text-anchor="middle" font-size="136" letter-spacing="6"
