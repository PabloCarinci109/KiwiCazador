<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081120"/>
      <stop offset="0.42" stop-color="#0C2730"/>
      <stop offset="1" stop-color="#051018"/>
    </linearGradient>
    <radialGradient id="lunaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E7F4D2" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#BFE0B4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#BFE0B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilloKiwi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E6A5C" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#1B4A44" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1B4A44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6035"/>
      <stop offset="0.55" stop-color="#6C4726"/>
      <stop offset="1" stop-color="#4A2E16"/>
    </linearGradient>
    <linearGradient id="panza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B58A57"/>
      <stop offset="1" stop-color="#8A5F33"/>
    </linearGradient>
    <linearGradient id="pico" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4CBA2"/>
      <stop offset="1" stop-color="#B08F62"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FABBB"/>
      <stop offset="0.32" stop-color="#E9F0F8"/>
      <stop offset="0.55" stop-color="#C3CDDA"/>
      <stop offset="1" stop-color="#7C8796"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E323B"/>
      <stop offset="0.45" stop-color="#434955"/>
      <stop offset="1" stop-color="#1C1F25"/>
    </linearGradient>
    <linearGradient id="monteLejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143540"/>
      <stop offset="1" stop-color="#0D2229"/>
    </linearGradient>
    <linearGradient id="monteCerca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2027"/>
      <stop offset="1" stop-color="#071419"/>
    </linearGradient>
