  <path d="M0 786 L132 676 L244 772 L362 660 L470 780 L590 690 L716 800 L838 700 L962 806 L1024 754 L1024 1024 L0 1024 Z"
        fill="url(#monteCerca)"/>

  <!-- resplandor del héroe -->
  <circle cx="470" cy="700" r="352" fill="url(#brilloKiwi)"/>

  <!-- cuchillo mariposa: segundo protagonista, a la derecha -->
  <g transform="translate(835 702) rotate(20)">
    <path d="M -38 6 L -38 -292 L -14 -400 L 0 -440 L 14 -400 L 38 -292 L 38 4 Z" fill="url(#acero)"/>
    <path d="M -38 -288 L -38 4 L -25 4 L -25 -286 Z" fill="#F4F8FF" opacity="0.9"/>
    <path d="M 17 -372 L 37 -292 L 28 -292 L 10 -364 Z" fill="#EEF4FD" opacity="0.7"/>
    <rect x="-42" y="-8" width="84" height="28" rx="7" fill="#C9D2DF"/>
    <circle cx="0" cy="14" r="17" fill="#E6ECF4"/>
    <circle cx="0" cy="14" r="7" fill="#7C8694"/>
    <rect x="-74" y="26" width="68" height="260" rx="22" fill="url(#mango)"/>
    <rect x="6" y="26" width="68" height="260" rx="22" fill="url(#mango)"/>
    <rect x="-68" y="34" width="56" height="244" rx="18" fill="#363B46" opacity="0.85"/>
    <rect x="12" y="34" width="56" height="244" rx="18" fill="#363B46" opacity="0.85"/>
    <g fill="#0A0B0E" stroke="#5A6170" stroke-width="3">
      <circle cx="-40" cy="112" r="21"/>
      <circle cx="-40" cy="222" r="21"/>
      <circle cx="40" cy="112" r="21"/>
      <circle cx="40" cy="222" r="21"/>
    </g>
    <rect x="-74" y="248" width="68" height="38" rx="14" fill="#15181D"/>
    <rect x="6" y="248" width="68" height="38" rx="14" fill="#15181D"/>
  </g>

  <!-- sombra en el piso -->
  <ellipse cx="462" cy="952" rx="200" ry="28" fill="#020A0E" opacity="0.55"/>
  <ellipse cx="762" cy="968" rx="104" ry="20" fill="#020A0E" opacity="0.45"/>

  <!-- kiwi -->
  <g>
    <!-- patas -->
    <g stroke="#C48334" stroke-width="17" stroke-linecap="round" fill="none">
      <path d="M 428 808 L 420 908"/>
      <path d="M 528 816 L 534 916"/>
    </g>
    <g stroke="#C48334" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M 420 906 L 386 934"/>
      <path d="M 420 906 L 422 950"/>
      <path d="M 420 906 L 456 932"/>
      <path d="M 534 914 L 500 942"/>
      <path d="M 534 914 L 536 958"/>
      <path d="M 534 914 L 570 940"/>
    </g>
    <!-- cola -->
    <path d="M 356 662 Q 292 690 316 742 Q 352 730 378 704 Z" fill="#4A2E16"/>
    <!-- cuerpo -->
